<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crazy Mosquitoes — Sales MIS Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1A0F0D; --maroon:#2D1515; --maroon2:#432020; --maroon3:#5C2B2B;
  --paper:#F4EDE2; --card:#FFFDF8; --line:#E2D5C2; --line2:#CDBBA0;
  --amber:#C9722E; --gold:#D9A441; --green:#3E7C4F; --red:#B03A2E;
  --mut:#8A7A66; --mut2:#6B5D4D;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --body:'DM Sans',system-ui,sans-serif;
  --disp:'Bebas Neue','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
::selection{background:var(--gold);color:var(--maroon)}

/* ============ HEADER ============ */
header{background:var(--maroon);color:#F2E8DA;padding:18px 26px 0;position:sticky;top:0;z-index:60;box-shadow:0 3px 14px rgba(26,15,13,.35)}
.hd-top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-size:34px;letter-spacing:2.5px;color:#F2E8DA;line-height:1}
.brand em{font-style:normal;color:var(--gold)}
.hd-sub{font-family:var(--mono);font-size:11px;color:#C9A882;letter-spacing:1px;text-transform:uppercase}
.hd-right{margin-left:auto;display:flex;gap:22px;align-items:baseline}
.tick{font-family:var(--mono);font-size:11px;color:#C9A882}
.tick b{color:#F2E8DA;font-size:15px;font-weight:700;margin-left:6px}
nav{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:thin}
nav button{appearance:none;border:0;background:transparent;color:#BFA68A;font-family:var(--disp);font-size:16px;letter-spacing:1.5px;padding:9px 15px 11px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s}
nav button:hover{color:#F2E8DA}
nav button.on{color:var(--gold);border-bottom-color:var(--gold)}
nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

main{max-width:1440px;margin:0 auto;padding:22px 26px 80px}
section{display:none}
section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ COMMON ============ */
h2{font-family:var(--disp);font-size:26px;letter-spacing:1.5px;color:var(--maroon);margin:4px 0 4px}
.sub{color:var(--mut2);font-size:12.5px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(45,21,21,.05)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr}main{padding:16px 12px 60px}header{padding:14px 14px 0}}

/* KPI */
.kpi .lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut2)}
.kpi .val{font-family:var(--disp);font-size:38px;letter-spacing:1px;color:var(--maroon);line-height:1.05;margin:6px 0 2px}
.kpi .val small{font-size:20px;color:var(--mut2)}
.kpi .cmp{font-family:var(--mono);font-size:11px;color:var(--mut2)}
.up{color:var(--green)!important;font-weight:600}
.dn{color:var(--red)!important;font-weight:600}
.kpi.hero{background:var(--maroon);border-color:var(--maroon)}
.kpi.hero .lbl{color:#C9A882}
.kpi.hero .val{color:var(--gold)}
.kpi.hero .cmp{color:#BFA68A}

/* filter strip */
.fstrip{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.fstrip label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mut2)}
select,.seg{font-family:var(--body);font-size:13px;border:1px solid var(--line2);border-radius:6px;background:#fff;padding:6px 9px;color:var(--ink)}
select:focus{outline:2px solid var(--gold)}
.seg{display:inline-flex;padding:0;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 13px;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--mut2);letter-spacing:.5px}
.seg button.on{background:var(--maroon);color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;background:#fff;color:var(--mut2);user-select:none}
.chip.on{background:var(--maroon);color:var(--gold);border-color:var(--maroon)}

/* tables */
.twrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--card)}
th{position:sticky;top:0;background:var(--maroon);color:#EAD9BF;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;padding:9px 10px;text-align:right;white-space:nowrap;z-index:5;cursor:default}
th:first-child,td:first-child{text-align:left}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--gold)}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
td:first-child{font-family:var(--body);font-weight:500;white-space:normal;min-width:150px}
tr:hover td{background:#F8F1E4}
tr.tot td{background:#EFE5D2;font-weight:700;border-top:2px solid var(--line2)}
.pos{color:var(--green);font-weight:600}
.neg{color:var(--red);font-weight:600}
.dim{color:var(--mut)}
.bar{display:inline-block;height:8px;background:linear-gradient(90deg,var(--amber),var(--gold));border-radius:4px;vertical-align:middle;margin-right:6px}
.heat{border-radius:4px;padding:2px 6px;display:inline-block;min-width:52px}

canvas{max-width:100%}
.chartbox{position:relative;height:340px}
.chartbox.tall{height:400px}
.chartbox.short{height:260px}

/* rank list */
.ranks{list-style:none}
.ranks li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line)}
.ranks .pos-n{font-family:var(--disp);font-size:20px;color:var(--line2);width:32px;text-align:center}
.ranks li:nth-child(1) .pos-n{color:var(--gold);font-size:26px}
.ranks li:nth-child(2) .pos-n{color:var(--amber)}
.ranks li:nth-child(3) .pos-n{color:var(--maroon3)}
.ranks .nm{flex:1;font-weight:500;font-size:13px}
.ranks .meta{font-family:var(--mono);font-size:11px;color:var(--mut2)}
.ranks .amt{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--maroon)}

/* pivot builder */
.pv-fields{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pv-field{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:6px 12px;font-family:var(--mono);font-size:11.5px;cursor:grab;user-select:none;letter-spacing:.4px}
.pv-field:active{cursor:grabbing}
.pv-field.dim-f{border-left:4px solid var(--maroon)}
.pv-field.val-f{border-left:4px solid var(--gold)}
.pv-zones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:900px){.pv-zones{grid-template-columns:repeat(2,1fr)}}
.pv-zone{background:var(--card);border:2px dashed var(--line2);border-radius:8px;min-height:86px;padding:8px}
.pv-zone.over{border-color:var(--gold);background:#FBF4E3}
.pv-zone h4{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut2);margin-bottom:6px}
.pv-zone .pv-field{margin:3px 3px 0 0;display:inline-flex;align-items:center;gap:6px}
.pv-field .x{color:var(--red);cursor:pointer;font-weight:700}
.pv-field select{padding:1px 3px;font-size:10px;border-radius:4px}
.hint{font-size:11.5px;color:var(--mut);font-family:var(--mono)}

/* insight cards */
.icard{border-left:4px solid var(--gold);padding:14px 16px}
.icard h4{font-family:var(--disp);font-size:17px;letter-spacing:1px;color:var(--maroon);margin-bottom:4px}
.icard p{font-size:12.5px;color:var(--mut2)}
.icard p b{color:var(--ink);font-family:var(--mono)}

.note{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:10px;letter-spacing:.3px}
footer{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--mut);padding:24px}
@media print{header{position:static}nav{display:none}section{display:block!important;page-break-after:always}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const sum=(arr,f)=>arr.reduce((a,r)=>a+f(r),0);

/* ================= 1. OVERVIEW ================= */
function rOv(){
  const el=document.getElementById('sec-ov');
  const today=DATA.filter(r=>r.d===LAST);
  const yday=DATA.filter(r=>r.d===new Date(LASTD-864e5).toISOString().slice(0,10));

/* ================= 1b. TARGET VS ACHIEVEMENT ================= */
const TGT={Hyderabad:300000,Pune:375000,Mumbai:285000,Delhi:250000};
const SCOLOR={Hyderabad:'#2D1515',Pune:'#B03A2E',Mumbai:'#C9722E',Delhi:'#3E7C4F'};
function tgtModel(){
  // May+Jun trend → weekday/weekend weights + ASP per store
  const MJ=['2026-05','2026-06'];
  const isWE=dt=>dt.getDay()===0||dt.getDay()===6;
  let nWE=0,nWD=0;
  for(let t=new Date('2026-05-01T00:00:00');t<=new Date('2026-06-30T00:00:00');t=new Date(+t+864e5))isWE(t)?nWE++:nWD++;
  const model={};
  STORES.forEach(s=>{
    const rows=DATA.filter(r=>r.s===s&&MJ.includes(r.mk));
    const we=sum(rows.filter(r=>r.wd===0||r.wd===6),r=>r.net);
    const wd=sum(rows.filter(r=>r.wd!==0&&r.wd!==6),r=>r.net);
    const q=sum(rows,r=>r.q),net=sum(rows,r=>r.net);
    const perWE=we/nWE,perWD=wd/nWD;
    const ratio=perWD>0?perWE/perWD:2;
    model[s]={ratio,asp:q>0?net/q:sum(DATA,r=>r.net)/sum(DATA,r=>r.q),mjNet:net,mjMonthly:net/2};
  });
  // July 2026 calendar
  const days=[];
  for(let d=1;d<=31;d++){const dt=new Date(2026,6,d);days.push({d,dt,we:isWE(dt),wd:WD[dt.getDay()]});}
  const nWEj=days.filter(x=>x.we).length,nWDj=days.length-nWEj;
  STORES.forEach(s=>{
    const m=model[s];
    m.wdT=TGT[s]/(nWDj+nWEj*m.ratio);
    m.weT=m.wdT*m.ratio;
  });
  days.forEach(x=>{
    x.t={};x.u={};x.tot=0;x.utot=0;
    STORES.forEach(s=>{const v=x.we?model[s].weT:model[s].wdT;x.t[s]=v;x.u[s]=v/model[s].asp;x.tot+=v;x.utot+=x.u[s];});
  });
  return{model,days,nWEj,nWDj};
}
function rTgt(){
  const el=document.getElementById('sec-tgt');
  const{model,days,nWEj,nWDj}=tgtModel();
  const TOTAL=Object.values(TGT).reduce((a,b)=>a+b,0);

  const mtdUT=days.filter(x=>x.d<=CURDAY).reduce((a,x)=>a+x.utot,0);
  const mtdA=sum(jul,r=>r.net),mtdQ=sum(jul,r=>r.q);
  const achv=mtdA/mtdT*100;
  const remT=TOTAL-mtdA,remD=31-CURDAY;

  const storeCards=STORES.map(s=>{
    const m=model[s];
    const sT=days.filter(x=>x.d<=CURDAY).reduce((a,x)=>a+x.t[s],0);

    return`<div class="card">

      <div style="font-family:var(--mono);font-size:11px;color:var(--mut2);margin:4px 0">WD ₹${Math.round(model[s].wdT).toLocaleString('en-IN')}/day · WE ₹${Math.round(model[s].weT).toLocaleString('en-IN')}/day · ≈${(model[s].wdT/m.asp).toFixed(1)} & ${(model[s].weT/m.asp).toFixed(1)} pcs (ASP ${fmt(m.asp)})</div>
      <div style="background:var(--line);border-radius:6px;height:14px;overflow:hidden;margin:8px 0 6px"><div style="height:100%;width:${Math.min(p,100)}%;background:${p>=100?'var(--green)':(p>=70?'var(--gold)':'var(--red)')};border-radius:6px"></div></div>
      <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px">
        <span>MTD tgt <b>${fmt(sT)}</b> · ${uT.toFixed(0)} pcs</span><span>actual <b>${fmt(sA)}</b> · ${sQ} pcs</span><span class="${p>=100?'pos':'neg'}"><b>${p.toFixed(0)}%</b></span>
      </div>

  el.innerHTML=`
  <h2>Target vs Achievement — July 2026</h2>

    <div class="card kpi"><div class="lbl">Required / day for B/E</div><div class="val">${fmt(remT/remD)}</div><div class="cmp">for ${remD} days left · pace projects ${fmtL(proj)} (<span class="${proj>=TOTAL?'pos':'neg'}">${(proj/TOTAL*100).toFixed(0)}%</span> of target)</div></div>

  <div class="note">Method: for each store, May–Jun net sales were averaged per weekend day vs per weekday → weekend weight w. Solve 23·x + 8·w·x = monthly break-even → x = weekday ₹ target; weekend day = w·x. Units = ₹ target ÷ store ASP (May–Jun). ★ = weekend. Achieved figures fill day by day as data updates.</div></div>`;

  const qtyBy={};STORES.forEach(s=>qtyBy[s]={});
  const qtyDay={};
  jul.forEach(r=>{qtyBy[r.s][r.day]=(qtyBy[r.s][r.day]||0)+r.q;qtyDay[r.day]=(qtyDay[r.day]||0)+r.q;});

      {type:'bar',label:'Daily target',data:days.map(x=>st?x.t[st]:x.tot),backgroundColor:'rgba(138,122,102,.28)',borderRadius:2,yAxisID:'y1'},
      {type:'line',label:'Target (cum)',data:tLine,borderColor:'#8A7A66',borderDash:[6,4],pointRadius:0,tension:.2,yAxisID:'y'},
      {type:'line',label:'Actual (cum)',data:aLine,borderColor:st?SCOLOR[st]:'#B03A2E',backgroundColor:st?SCOLOR[st]:'#B03A2E',borderWidth:3,pointRadius:2,tension:.2,spanGaps:false,yAxisID:'y'}]},
      options:{plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}},scales:{y:{ticks:{callback:v=>fmtL(v)},title:{display:true,text:'CUMULATIVE'}},y1:{position:'right',grid:{display:false},ticks:{callback:v=>fmtL(v)},title:{display:true,text:'DAILY'}},x:{title:{display:true,text:'JULY DATE'}}},maintainAspectRatio:false}});

  const drawTable=st=>{

      let runA=0,runTmtd=0;

          STORES.map(s=>{
            const sa=x.d<=CURDAY?(actBy[s][x.d]||0):null;

          }).join('')+
          `<td><b>${fmt(x.tot)}</b> / ${x.utot.toFixed(1)}</td><td>${a!=null?'<b>'+fmt(a)+'</b> / '+(qtyDay[x.d]||0)+'p':'<span class="dim">—</span>'}</td><td class="${p==null?'dim':(p>=100?'pos':'neg')}">${p==null?'—':p.toFixed(0)+'%'}</td></tr>`;

        `<td>${fmtL(TOTAL)} / ${Math.round(days.reduce((a,x)=>a+x.utot,0))}</td><td><b>${fmt(runA)}</b> / ${sum(jul,r=>r.q)}p</td><td class="${runA/runTmtd*100>=100?'pos':'neg'}">${(runA/runTmtd*100).toFixed(0)}% MTD</td></tr></table>`;
      document.getElementById('tgtTblTitle').textContent='Day-wise target vs achievement — all stores (₹ target / pcs target · ✓ achieved)';

      let cT=0,cA=0;

          `<td>${fmt(cT)}</td><td>${x.d<=CURDAY?fmt(cA):'<span class="dim">—</span>'}</td><td class="${cp==null?'dim':(cp>=100?'pos':'neg')}">${cp==null?'—':cp.toFixed(0)+'%'}</td>`+

  drawTable('');drawChart('');
}

}

}
const SZORD=['XS','S','M','L','XL','XXL','Onesize'];
function drawTrk(){
  const rows=DATA.filter(r=>(!trkF.node||r.n===trkF.node)&&(!trkF.store||r.s===trkF.store));
  const TN=sum(rows,r=>r.net)||1;
  /* ---- size impact ---- */
  const sz={};rows.forEach(r=>{(sz[r.sz]=sz[r.sz]||{q:0,net:0}).q+=r.q;sz[r.sz].net+=r.net;});
  const szKeys=SZORD.filter(k=>sz[k]).concat(Object.keys(sz).filter(k=>!SZORD.includes(k)).sort());
  mkChart('cTrkSz',{data:{labels:szKeys,datasets:[
    {type:'bar',label:'Units',data:szKeys.map(k=>sz[k].q),backgroundColor:'#5C2B2B',borderRadius:4,yAxisID:'y'},
    {type:'line',label:'% of net ₹',data:szKeys.map(k=>sz[k].net/TN*100),borderColor:'#D9A441',backgroundColor:'#D9A441',yAxisID:'y1',tension:.3}]},
    options:{plugins:{tooltip:{callbacks:{label:c=>c.dataset.yAxisID==='y'?'Units: '+fnum(c.raw)+' · '+fmt(sz[szKeys[c.dataIndex]].net):'% of net: '+c.raw.toFixed(1)+'%'}}},scales:{y:{},y1:{position:'right',grid:{display:false},ticks:{callback:v=>v+'%'}}},maintainAspectRatio:false}});
  const topSz=szKeys.slice().sort((a,b)=>sz[b].net-sz[a].net).slice(0,2);
  document.getElementById('trkSzNote').textContent=topSz.map(k=>k+' = '+(sz[k].net/TN*100).toFixed(0)+'% of value').join(' · ')+' — together '+(topSz.reduce((a,k)=>a+sz[k].net,0)/TN*100).toFixed(0)+'% of sales in this cut';
  /* ---- color impact ---- */
  const co={};rows.forEach(r=>{(co[r.c]=co[r.c]||{q:0,net:0}).q+=r.q;co[r.c].net+=r.net;});
  const coKeys=Object.keys(co).sort((a,b)=>co[b].net-co[a].net);
  const CMAP={Black:'#1A1A1A',White:'#D8D2C4',Blue:'#2E5C8A',['Cobalt Blue']:'#1E4FBB',['Navy Blue']:'#1B2A4A',Red:'#B03A2E',Grey:'#8C8C86',Charcoal:'#4A4A48',Orange:'#D07327',Green:'#3E7C4F',Pink:'#C97A9B',Mustard:'#C9A02E',Olive:'#6B6B33',Beige:'#C9B28E',Brown:'#6B4A2E'};
  mkChart('cTrkCol',{type:'bar',data:{labels:coKeys,datasets:[{label:'Units',data:coKeys.map(k=>co[k].q),backgroundColor:coKeys.map(k=>CMAP[k]||'#8A7A66'),borderColor:'#CDBBA0',borderWidth:1,borderRadius:4}]},
    options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fnum(c.raw)+' pcs · '+fmt(co[coKeys[c.dataIndex]].net)+' ('+(co[coKeys[c.dataIndex]].net/TN*100).toFixed(1)+'% of net)'}}},maintainAspectRatio:false}});
  const c3=coKeys.slice(0,3);
  document.getElementById('trkColNote').textContent='Top 3 colors ('+c3.join(', ')+') = '+(c3.reduce((a,k)=>a+co[k].net,0)/TN*100).toFixed(0)+'% of net sales in this cut';
  /* ---- size × color matrix ---- */
  const mx={};rows.forEach(r=>{const k=r.c+'\u0001'+r.sz;mx[k]=(mx[k]||0)+r.q;});
  const maxCell=Math.max(1,...Object.values(mx));
  let mh='<table><tr><th>Color</th>'+szKeys.map(k=>'<th>'+k+'</th>').join('')+'<th>Total</th><th>Net ₹</th></tr>';
  coKeys.forEach(c=>{
    mh+='<tr><td>'+esc(c)+'</td>'+szKeys.map(s=>{const v=mx[c+'\u0001'+s]||0;const a=v/maxCell;return '<td>'+(v?`<span class="heat" style="background:rgba(201,114,46,${.1+a*.5})">${v}</span>`:'<span class="dim">·</span>')+'</td>';}).join('')+
      '<td><b>'+fnum(co[c].q)+'</b></td><td>'+fmt(co[c].net)+'</td></tr>';
  });
  mh+='<tr class="tot"><td>TOTAL</td>'+szKeys.map(s=>'<td>'+fnum(sz[s].q)+'</td>').join('')+'<td>'+fnum(sum(rows,r=>r.q))+'</td><td>'+fmtL(TN)+'</td></tr></table>';
  document.getElementById('trkMx').innerHTML=mh;
  /* ---- style table ---- */
  const map={};
  rows.forEach(r=>{
    const k=r.n+'|'+r.st;
    if(!map[k])map[k]={n:r.n,st:r.st,m:{},q:0,net:0,basic:0,cols:{},szs:{}};
    const x=map[k];
    x.m[r.mk]=(x.m[r.mk]||0)+r.q;x.q+=r.q;x.net+=r.net;x.basic+=r.basic;
    x.cols[r.c]=(x.cols[r.c]||0)+r.q;x.szs[r.sz]=(x.szs[r.sz]||0)+r.q;
  });
  const list=Object.values(map).sort((a,b)=>b.net-a.net);

  const bySize=trkF.view==='sz';

  list.forEach(x=>{

      COLS.map(k=>{const v=get(k);return '<td>'+(v?(bySize?'<b>'+fnum(v)+'</b>':fnum(v)):'<span class="dim">·</span>')+'</td>';}).join('')+
      '<td><b>'+fnum(x.q)+'</b></td><td>'+fmt(x.net)+'</td><td>'+(x.q>0?fmt(x.net/x.q):'—')+'</td><td class="'+(disc>30?'neg':'dim')+'">'+disc.toFixed(0)+'%</td><td>'+(x.q/tq*100).toFixed(1)+'%</td></tr>';
  });
  const colTot=k=>bySize?(sz[k]?sz[k].q:0):sum(rows.filter(r=>r.mk===k),r=>r.q);
  h+='<tr class="tot"><td>TOTAL ('+list.length+' styles)</td><td></td><td></td>'+(bySize?'':'<td></td>')+COLS.map(k=>'<td>'+fnum(colTot(k))+'</td>').join('')+'<td>'+fnum(sum(rows,r=>r.q))+'</td><td>'+fmtL(sum(rows,r=>r.net))+'</td><td></td><td></td><td>100%</td></tr></table>';
  document.getElementById('trkTbl').innerHTML=h;
  document.getElementById('trkCount').textContent=list.length+' styles · '+fnum(sum(rows,r=>r.q))+' units · '+coKeys.length+' colors · '+szKeys.length+' sizes';
}

/* ================= 6b. STOCK VS SALES ================= */
const INVDATE='2026-07-08';
function rStk(){
  const el=document.getElementById('sec-stk');
  const cut=new Date(new Date(INVDATE)-30*864e5).toISOString().slice(0,10);
  /* sales lookups — all barcode-keyed for an airtight join */
  const soldBC={},netBC={},sold30BC={};
  DATA.forEach(r=>{
    const k=r.s+'\u0001'+r.bc;
    soldBC[k]=(soldBC[k]||0)+r.q;
    netBC[k]=(netBC[k]||0)+r.net;
    if(r.d>=cut)sold30BC[k]=(sold30BC[k]||0)+r.q;
  });
  /* style×store aggregates from stock joined with sales */
  const agg={};
  STOCK.forEach(x=>{
    const k=x.s+'\u0001'+x.st;
    if(!agg[k])agg[k]={s:x.s,st:x.st,n:x.n,c:{},sizes:{},shop:0,wh:0,cost:0,mrpv:0,sold:0,net:0,q30:0};
    const a=agg[k];
    a.c[x.c]=1;
    const bk=x.s+'\u0001'+x.bc;
    const sz=a.sizes[x.sz]=a.sizes[x.sz]||{shop:0,wh:0,sold:0};
    sz.shop+=x.shop;sz.wh+=x.wh;
    sz.sold+=soldBC[bk]||0;
    a.sold+=soldBC[bk]||0;a.net+=netBC[bk]||0;a.q30+=sold30BC[bk]||0;
    a.shop+=x.shop;a.wh+=x.wh;a.cost+=(x.shop+x.wh)*x.cost;a.mrpv+=(x.shop+x.wh)*x.mrp;
  });
  const LIST=Object.values(agg).map(a=>{
    a.soh=a.shop+a.wh;
    a.st_pct=(a.sold+a.soh)>0?a.sold/(a.sold+a.soh)*100:0;
    a.cover=a.q30>0?a.soh/(a.q30/30):null;
    if(a.soh===0&&a.sold>0)a.flag='SOLD OUT';
    else if(a.q30>0&&a.cover<=7)a.flag='CRITICAL';
    else if(a.q30>0&&a.cover<=21)a.flag='WATCH';
    else if(a.q30>0)a.flag='HEALTHY';
    else if(a.sold>0)a.flag='SLOW';
    else a.flag='DEAD';
    /* action engine */
    if(a.flag==='SOLD OUT')a.act='REORDER';
    else if((a.flag==='CRITICAL'||a.flag==='WATCH')&&a.shop<=2&&a.wh>0)a.act='PULL FROM WH';
    else if(a.flag==='CRITICAL')a.act='REFILL NOW';
    else if(a.flag==='WATCH')a.act='PLAN REFILL';
    else if(a.flag==='DEAD')a.act='MARKDOWN / RTV';
    else if(a.flag==='SLOW'&&a.cover===null)a.act='RELOCATE / PUSH';
    else a.act='';
    return a;
  });
  const FLAGS=['SOLD OUT','CRITICAL','WATCH','HEALTHY','SLOW','DEAD'];
  const FCLR={['SOLD OUT']:'#B03A2E',CRITICAL:'#B03A2E',WATCH:'#C9722E',HEALTHY:'#3E7C4F',SLOW:'#8A7A66',DEAD:'#6B5D4D'};
  /* KPIs */
  const soh=sum(LIST,a=>a.soh),shop=sum(LIST,a=>a.shop),wh=sum(LIST,a=>a.wh);
  const soldT=sum(DATA,r=>r.q);
  const stPct=soldT/(soldT+soh)*100;
  const q30T=sum(DATA.filter(r=>r.d>=cut),r=>r.q);
  const coverT=soh/(q30T/30);
  const deadV=sum(LIST.filter(a=>a.flag==='DEAD'),a=>a.cost);
  const brokenCells=LIST.reduce((n,a)=>n+Object.values(a.sizes).filter(z=>z.sold>0&&z.shop+z.wh===0).length,0);
  const pullWH=LIST.filter(a=>a.act==='PULL FROM WH');

  /* store × node summary */
  const sn={};
  LIST.forEach(a=>{const k=a.s+'\u0001'+a.n;if(!sn[k])sn[k]={sold:0,soh:0,q30:0};sn[k].sold+=a.sold;sn[k].soh+=a.soh;sn[k].q30+=a.q30;});

  el.innerHTML=`
  <h2>Stock vs Sales — closing SOH ${new Date(INVDATE).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</h2>
  <div class="sub">Store → node → style → size mapping of YTD sales against closing inventory (floor + warehouse), with days-of-cover flags (Critical ≤7d · Watch 8–21d · Healthy >21d, on last-30-day rate)</div>
  <div class="grid g4">
    <div class="card kpi hero"><div class="lbl">Closing SOH</div><div class="val">${fnum(soh)} <small>pcs</small></div><div class="cmp">${fnum(shop)} on floor · ${fnum(wh)} in WH</div></div>
    <div class="card kpi"><div class="lbl">Stock value</div><div class="val">${fmtL(sum(LIST,a=>a.cost))}</div><div class="cmp">at cost · ${fmtL(sum(LIST,a=>a.mrpv))} at MRP</div></div>
    <div class="card kpi"><div class="lbl">YTD sell-through</div><div class="val">${stPct.toFixed(1)}%</div><div class="cmp">${fnum(soldT)} sold vs ${fnum(soh)} on hand</div></div>
    <div class="card kpi"><div class="lbl">Chain stock cover</div><div class="val">${Math.round(coverT)} <small>days</small></div><div class="cmp">at last-30-day rate (${q30T} pcs/30d)</div></div>
  </div>
  <div class="grid g4" style="margin-top:14px">
    <div class="card icard" style="border-left-color:var(--red)"><h4>Broken size options</h4><p><b>${brokenCells}</b> size cells sold YTD but now at zero stock — direct lost-sale risk. Filter flag = SOLD OUT / scan red cells below.</p></div>
    <div class="card icard" style="border-left-color:var(--amber)"><h4>Pull from warehouse</h4><p><b>${pullWH.length}</b> style-store lines are thin on the floor with backup sitting in WH — zero-cost refill, do it first.</p></div>
    <div class="card icard"><h4>Dead stock</h4><p><b>${LIST.filter(a=>a.flag==='DEAD').length}</b> style-store lines with stock but no sales ever — <b>${fmtL(deadV)}</b> at cost locked. Markdown / RTV / relocate candidates.</p></div>
    <div class="card icard" style="border-left-color:var(--green)"><h4>Working stock</h4><p><b>${LIST.filter(a=>['CRITICAL','WATCH','HEALTHY'].includes(a.flag)).length}</b> lines sold in the last 30 days; of these <b>${LIST.filter(a=>a.flag==='CRITICAL').length} critical</b> (≤7 days cover) need action this week.</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h2 style="font-size:18px">Store × Node — sold vs SOH vs sell-through</h2><div class="twrap" id="stkSN"></div></div>
  <div class="fstrip" style="margin-top:14px">
    <label>Store</label><select id="stkStore"><option value="">All stores</option>${STORES.map(s=>`<option>${s}</option>`).join('')}</select>
    <label>Node</label><select id="stkNode"><option value="">All nodes</option>${NODES.map(n=>`<option>${n}</option>`).join('')}</select>
    <label>Flag</label><select id="stkFlag"><option value="">All flags</option>${FLAGS.map(f=>`<option>${f}</option>`).join('')}</select>
    <label>Find</label><input id="stkQ" placeholder="style name…" style="border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font-family:var(--body);font-size:13px">
    <span class="hint" id="stkCount"></span>
  </div>
  <div class="card"><h2 style="font-size:18px">Style × Size — sales vs stock grid</h2>
  <div class="hint" style="margin-bottom:8px">Each size cell = <b>sold · stock</b> (stock = floor + WH; hover for split). <span style="color:var(--red);font-weight:700">Red</span> = sold but zero stock (broken) · <span style="color:var(--mut)">grey</span> = stock never sold · gold = selling with stock.</div>
  <div class="twrap" id="stkTbl" style="max-height:700px"></div></div>`;

  /* store×node table */
  let sh='<table><tr><th>Store</th>'+NODES.map(n=>'<th colspan="3">'+n+'</th>').join('')+'<th colspan="3" style="background:#432020">TOTAL</th></tr><tr><th></th>'+(NODES.map(()=>'<th style="background:#5C2B2B">Sold</th><th style="background:#5C2B2B">SOH</th><th style="background:#5C2B2B">ST%</th>').join(''))+'<th style="background:#5C2B2B">Sold</th><th style="background:#5C2B2B">SOH</th><th style="background:#5C2B2B">ST%</th></tr>';
  STORES.forEach(s=>{
    sh+='<tr><td>'+s+'</td>';let ts=0,th=0;
    NODES.forEach(n=>{const v=sn[s+'\u0001'+n]||{sold:0,soh:0};ts+=v.sold;th+=v.soh;
      const st=(v.sold+v.soh)>0?v.sold/(v.sold+v.soh)*100:null;
      sh+=`<td>${v.sold||'<span class="dim">·</span>'}</td><td>${v.soh||'<span class="dim">·</span>'}</td><td class="${st==null?'dim':(st>=40?'pos':(st<15?'neg':''))}">${st==null?'—':st.toFixed(0)+'%'}</td>`;});
    const st=(ts+th)>0?ts/(ts+th)*100:null;
    sh+=`<td><b>${ts}</b></td><td><b>${th}</b></td><td class="${st>=40?'pos':(st<15?'neg':'')}"><b>${st.toFixed(0)}%</b></td></tr>`;
  });
  sh+='</table>';
  document.getElementById('stkSN').innerHTML=sh;

  const F={store:'',node:'',flag:'',q:''};
  const FL_ORD={['SOLD OUT']:0,CRITICAL:1,WATCH:2,HEALTHY:3,SLOW:4,DEAD:5};
  const draw=()=>{
    let list=LIST.filter(a=>(!F.store||a.s===F.store)&&(!F.node||a.n===F.node)&&(!F.flag||a.flag===F.flag)&&(!F.q||a.st.toLowerCase().includes(F.q)));
    list.sort((a,b)=>FL_ORD[a.flag]-FL_ORD[b.flag]||(a.cover??1e9)-(b.cover??1e9)||b.net-a.net);
    const szKeys=SZORD.filter(k=>list.some(a=>a.sizes[k])).concat([...new Set(list.flatMap(a=>Object.keys(a.sizes)))].filter(k=>!SZORD.includes(k)).sort());
    let h='<table><tr><th>Store</th><th>Style</th><th>Node</th>'+szKeys.map(k=>'<th>'+k+'</th>').join('')+'<th>Sold YTD</th><th>30d</th><th>Floor</th><th>WH</th><th>ST%</th><th>Cover</th><th>Flag</th><th>Action</th></tr>';
    list.forEach(a=>{
      h+='<tr><td style="min-width:74px">'+a.s+'</td><td>'+esc(a.st)+'</td><td>'+a.n+'</td>'+
        szKeys.map(k=>{
          const z=a.sizes[k];
          if(!z)return'<td><span class="dim"></span></td>';
          const stk=z.shop+z.wh;
          let style='';
          if(z.sold>0&&stk===0)style='background:rgba(176,58,46,.16);color:var(--red);font-weight:700';
          else if(stk>0&&z.sold===0)style='color:var(--mut)';
          else if(z.sold>0)style='background:rgba(217,164,65,.14)';
          return`<td style="${style}" title="floor ${z.shop} · WH ${z.wh}">${z.sold}·${stk}</td>`;
        }).join('')+
        `<td><b>${a.sold}</b></td><td>${a.q30||'<span class="dim">·</span>'}</td><td>${a.shop}</td><td>${a.wh||'<span class="dim">·</span>'}</td><td class="${a.st_pct>=40?'pos':(a.st_pct<15?'neg':'')}">${a.st_pct.toFixed(0)}%</td><td>${a.cover!=null?Math.round(a.cover)+'d':'<span class="dim">∞</span>'}</td>`+
        `<td><span class="heat" style="background:${FCLR[a.flag]}22;color:${FCLR[a.flag]};font-weight:700;font-size:10px">${a.flag}</span></td><td style="font-family:var(--mono);font-size:10.5px">${a.act}</td></tr>`;
    });
    h+=`<tr class="tot"><td>TOTAL</td><td>${list.length} lines</td><td></td>`+szKeys.map(k=>{
      const so=sum(list,a=>a.sizes[k]?a.sizes[k].sold:0),st=sum(list,a=>a.sizes[k]?a.sizes[k].shop+a.sizes[k].wh:0);
      return'<td>'+so+'·'+st+'</td>';}).join('')+
      `<td>${sum(list,a=>a.sold)}</td><td>${sum(list,a=>a.q30)}</td><td>${sum(list,a=>a.shop)}</td><td>${sum(list,a=>a.wh)}</td><td colspan="4"></td></tr></table>`;
    document.getElementById('stkTbl').innerHTML=h;
    document.getElementById('stkCount').textContent=list.length+' style-store lines · '+fnum(sum(list,a=>a.soh))+' pcs SOH · '+fmtL(sum(list,a=>a.cost))+' at cost';
  };
  document.getElementById('stkStore').onchange=e=>{F.store=e.target.value;draw();};
  document.getElementById('stkNode').onchange=e=>{F.node=e.target.value;draw();};
  document.getElementById('stkFlag').onchange=e=>{F.flag=e.target.value;draw();};
  document.getElementById('stkQ').oninput=e=>{F.q=e.target.value.toLowerCase();draw();};
  draw();
}


/* ================= 6c. MERCHANDISE PLAN / IDEAL BASE STOCK ================= */
const MCAP={Hyderabad:250,Delhi:195,Mumbai:195,Pune:450};
const TIGHT=new Set(['Jeans','Shirt']); /* 3-4 sizes, max 1 pc per size */
function rMch(){
  const el=document.getElementById('sec-mch');
  el.innerHTML=`
  <h2>Merchandise Plan · Ideal Base Stock & Turns</h2>
  <div class="sub">Capacity-constrained base stock to service the break-even targets — options × depth by node, with required stock turns, refill cadence and gap vs current SOH. Edit capacities to replan live.</div>
  <div class="fstrip">
    <label>Capacity</label>
    ${STORES.map(s=>`<span style="font-family:var(--mono);font-size:11px;color:var(--mut2)">${s} <input type="number" id="cap_${s}" value="${MCAP[s]}" min="${s==='Pune'?300:175}" max="${s==='Pune'?550:(s==='Hyderabad'?260:215)}" style="width:64px;border:1px solid var(--line2);border-radius:6px;padding:5px;font-family:var(--mono)"></span>`).join('')}
    <label style="margin-left:6px">Discount</label><input type="number" id="mchDisc" value="21" min="18" max="24" style="width:54px;border:1px solid var(--line2);border-radius:6px;padding:5px;font-family:var(--mono)"><span class="hint">%</span>
    <label>Winner share</label><input type="number" id="mchWin" value="55" min="50" max="60" style="width:54px;border:1px solid var(--line2);border-radius:6px;padding:5px;font-family:var(--mono)"><span class="hint">% of stock</span>
    <span class="hint">Hyd 250 (wall + 2 browsers) · Del/Mum 175–215 · Pune 450</span>
  </div>
  <div class="grid g4" id="mchKpis"></div>
  <div class="card" style="margin-top:14px"><h2 style="font-size:18px">Store × Node plan — base stock, options, turns, refill</h2><div class="twrap" id="mchTbl" style="max-height:700px"></div>
  <div class="note" id="mchNote"></div></div>
  <div class="card" style="margin-top:14px"><h2 style="font-size:18px">Winner Bank — proven styles to fill the W slots</h2>
  <div class="hint" style="margin-bottom:8px">Top sellers per node by chain net sales. Anchor each store's winner options here first; a winner missing from a store (grey dot) is the cheapest expansion available.</div>
  <div class="twrap" id="mchWinTbl" style="max-height:520px"></div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2 style="font-size:18px">Recommended size set per option</h2><div class="twrap" id="mchSize"></div>
    <div class="note">Jeans & Shirts: hard limit 3–4 sizes × 1 pc. Other nodes: 6 pcs/option shaped on the chain size curve — double depth in the two best sizes. Nodes with thin sales data get the standard curve. Separately: Onesize free-size tees are ~20% of T-shirt units — carry 3–4 dedicated Onesize options (depth 2–3) inside the T-shirt option count.</div></div>
    <div class="card"><h2 style="font-size:18px">Reality check — required velocity vs current run rate</h2><div class="twrap" id="mchVel"></div>
    <div class="note">Base stock enables the target; it doesn't create demand. Where the multiple is high, the plan must ride on footfall, marketing and conversion — not more inventory.</div></div>
  </div>`;

  /* node ASP + size curves (chain level) */
  const nodeAgg={};DATA.forEach(r=>{const a=nodeAgg[r.n]=nodeAgg[r.n]||{q:0,net:0,sz:{}};a.q+=r.q;a.net+=r.net;a.sz[r.sz]=(a.sz[r.sz]||0)+r.q;});
  const mrpAgg={};DATA.forEach(r=>{const a=mrpAgg[r.n]=mrpAgg[r.n]||{v:0,q:0};if(r.q>0){a.v+=r.mrp*r.q;a.q+=r.q;}});
  const nodeMRP={};NODES.forEach(n=>nodeMRP[n]=mrpAgg[n]&&mrpAgg[n].q>0?mrpAgg[n].v/mrpAgg[n].q:4700);
  /* size set per node */
  const sizeSet={};
  NODES.forEach(n=>{
    const sz=nodeAgg[n].sz;
    const ord=Object.entries(sz).filter(([k])=>k!=='nan'&&k!=='Onesize').sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const sample=Object.entries(sz).filter(([k])=>k!=='nan'&&k!=='Onesize').reduce((a,[,v])=>a+v,0);
    if(sample<15&&!TIGHT.has(n)){sizeSet[n]={set:'S-1 · M-2 · L-2 · XL-1',depth:6,fallback:true};return;}
    if(sample<15&&TIGHT.has(n)){sizeSet[n]={set:'M-1 · L-1 · XL-1',depth:3,fallback:true};return;}
    if(TIGHT.has(n)){
      const pick=SZORD.filter(k=>ord.slice(0,4).includes(k));
      sizeSet[n]={set:pick.map(k=>k+'-1').join(' · '),depth:pick.length};
    }else{
      const top=ord.slice(0,4);
      const inOrd=SZORD.filter(k=>top.includes(k));
      const best2=ord.slice(0,2);
      const d={};let left=6;
      inOrd.forEach(k=>{d[k]=best2.includes(k)?2:1;left-=d[k];});
      while(left>0){d[best2[0]]++;left--;}
      while(left<0){const last=inOrd[inOrd.length-1];if(d[last]>1)d[last]--;else d[best2[0]]--;left++;}
      sizeSet[n]={set:inOrd.map(k=>k+'-'+d[k]).join(' · '),depth:Object.values(d).reduce((a,b)=>a+b,0)};
    }
  });
  /* store node mix (net-based, shrunk to chain mix for thin stores) */
  const chainNet=sum(DATA,r=>r.net);
  const chainMix={};NODES.forEach(n=>chainMix[n]=nodeAgg[n].net/chainNet);
  const storeMix={};
  STORES.forEach(s=>{
    const rows=DATA.filter(r=>r.s===s);
    const u=sum(rows,r=>r.q);
    const w=Math.min(1,u/60);
    const sNetT=sum(rows,r=>r.net);
    const mix={};let tot=0;
    NODES.forEach(n=>{const sm=sNetT>0?sum(rows.filter(r=>r.n===n),r=>r.net)/sNetT:0;mix[n]=w*sm+(1-w)*chainMix[n];tot+=mix[n];});
    NODES.forEach(n=>mix[n]/=tot);
    storeMix[s]={mix,w,units:u};
  });
  /* current SOH per store×node */
  const sohSN={};STOCK.forEach(x=>{const k=x.s+'\u0001'+x.n;sohSN[k]=(sohSN[k]||0)+x.shop+x.wh;});
  const sohAll=Object.values(sohSN).reduce((a,b)=>a+b,0);
  /* last-30d units per store */
  const cut=new Date(new Date(INVDATE)-30*864e5).toISOString().slice(0,10);
  const q30S={};DATA.forEach(r=>{if(r.d>=cut)q30S[r.s]=(q30S[r.s]||0)+r.q;});

  const draw=()=>{
    const cap={};STORES.forEach(s=>cap[s]=Math.max(1,+document.getElementById('cap_'+s).value||MCAP[s]));
    const disc=Math.min(24,Math.max(18,+document.getElementById('mchDisc').value||21));
    const ws=Math.min(60,Math.max(50,+document.getElementById('mchWin').value||55));
    const nodeASP={};NODES.forEach(n=>nodeASP[n]=nodeMRP[n]*(1-disc/100));
    const plan=[];let totBase=0,totReq=0,totOpts=0;
    STORES.forEach(s=>{
      const tgt=TGT[s];
      const nodes=NODES.map(n=>{
        const rupees=tgt*storeMix[s].mix[n];
        return{n,rupees,units:rupees/nodeASP[n]};
      });
      const U=nodes.reduce((a,x)=>a+x.units,0);
      nodes.forEach(x=>{
        x.base=cap[s]*x.units/U;
        x.depth=sizeSet[x.n].depth;
        x.opts=Math.max(x.base>=x.depth/2?1:0,Math.round(x.base/x.depth));
        x.baseR=x.opts*x.depth;
        x.turnY=x.units/Math.max(1,x.baseR)*12;
        x.cover=x.baseR/(x.units/30);
        x.refill=x.units/4.33;
        x.soh=sohSN[s+'\u0001'+x.n]||0;
        x.gap=x.baseR-x.soh;
      });
      /* rebalance to respect shelf capacity after rounding to whole options */
      let guard=0;
      const tot=()=>nodes.reduce((a,x)=>a+x.baseR,0);
      while(tot()>cap[s]&&guard++<50){
        const cand=nodes.filter(x=>x.opts>1).sort((a,b)=>(b.baseR/Math.max(b.units,.1))-(a.baseR/Math.max(a.units,.1)))[0];
        if(!cand)break;cand.opts--;cand.baseR=cand.opts*cand.depth;
      }
      while(cap[s]-tot()>=Math.min(...nodes.filter(x=>x.units>0.5).map(x=>x.depth))&&guard++<100){
        const cand=nodes.filter(x=>x.units>0.5).sort((a,b)=>(a.baseR/Math.max(a.units,.1))-(b.baseR/Math.max(b.units,.1)))[0];
        if(!cand)break;cand.opts++;cand.baseR=cand.opts*cand.depth;
      }
      nodes.forEach(x=>{
        x.turnY=x.units/Math.max(1,x.baseR)*12;
        x.cover=x.units>0.5?x.baseR/(x.units/30):null;
        x.wOpts=Math.round(x.opts*ws/100);x.fOpts=x.opts-x.wOpts;
      });
      plan.push({s,tgt,U,cap:cap[s],nodes});
      totReq+=U;totBase+=nodes.reduce((a,x)=>a+x.baseR,0);totOpts+=nodes.reduce((a,x)=>a+x.opts,0);
    });
    document.getElementById('mchKpis').innerHTML=`
      <div class="card kpi hero"><div class="lbl">Planned base stock</div><div class="val">${fnum(totBase)} <small>pcs</small></div><div class="cmp">vs capacity ${fnum(Object.values(cap).reduce((a,b)=>a+b,0))} · ${fnum(totOpts)} options chain-wide</div></div>
      <div class="card kpi"><div class="lbl">Required sales / month</div><div class="val">${Math.round(totReq)} <small>pcs</small></div><div class="cmp">for ${fmtL(Object.values(TGT).reduce((a,b)=>a+b,0))} B/E at ${disc}% discount (net of MRP)</div></div>
      <div class="card kpi"><div class="lbl">Implied stock turn</div><div class="val">${(totReq/totBase*12).toFixed(1)}×<small>/yr</small></div><div class="cmp">${(totReq/totBase).toFixed(2)}× per month · ${Math.round(totBase/(totReq/30))} days cover</div></div>
      <div class="card kpi"><div class="lbl">Current SOH vs plan</div><div class="val">${fnum(sohAll)} <small>pcs</small></div><div class="cmp">${sohAll>totBase?'trim '+fnum(sohAll-totBase)+' pcs & rebalance mix':'add '+fnum(totBase-sohAll)+' pcs'}</div></div>`;
    let h='<table><tr><th>Store / Node</th><th>Mix %</th><th>Tgt ₹/mo</th><th>Req pcs/mo</th><th>Base stock</th><th>Options × depth</th><th>Size set / option</th><th>Turn /yr</th><th>Cover</th><th>Wkly refill</th><th>SOH now</th><th>Gap</th><th>Move</th></tr>';
    plan.forEach(p=>{
      const tb=p.nodes.reduce((a,x)=>a+x.baseR,0),to=p.nodes.reduce((a,x)=>a+x.opts,0),ts=p.nodes.reduce((a,x)=>a+x.soh,0);
      h+=`<tr style="background:#EFE5D2"><td><b style="color:${SCOLOR[p.s]}">${p.s.toUpperCase()}</b></td><td></td><td><b>${fmtL(p.tgt)}</b></td><td><b>${Math.round(p.U)}</b></td><td><b>${tb}</b> <span class="dim">/ cap ${p.cap}</span></td><td><b>${to} options</b></td><td></td><td><b>${(p.U/tb*12).toFixed(1)}×</b></td><td><b>${Math.round(tb/(p.U/30))}d</b></td><td><b>${Math.round(p.U/4.33)}</b></td><td><b>${ts}</b></td><td class="${tb-ts>=0?'pos':'neg'}"><b>${tb-ts>=0?'+':''}${tb-ts}</b></td><td></td></tr>`;
      p.nodes.slice().sort((a,b)=>b.units-a.units).forEach(x=>{
        const move=x.gap>0?('ADD '+Math.ceil(x.gap/x.depth)+' opt'):(x.gap<0?('CUT '+Math.ceil(-x.gap/x.depth)+' opt'):'HOLD');
        h+=`<tr><td style="padding-left:22px">${x.n}${TIGHT.has(x.n)?' <span class="dim" style="font-size:10px">†</span>':''}</td><td>${(storeMix[p.s].mix[x.n]*100).toFixed(0)}%</td><td>${fmt(x.rupees)}</td><td>${x.units.toFixed(1)}</td><td>${x.baseR}</td><td>${x.opts} × ${x.depth} <span class="dim" style="font-size:10px">(${x.wOpts}W·${x.fOpts}F)</span></td><td style="font-family:var(--mono);font-size:10.5px">${sizeSet[x.n].set}</td><td>${x.units>0.5&&x.baseR>0?x.turnY.toFixed(1)+'×':'<span class="dim">—</span>'}</td><td>${x.cover!=null&&x.baseR>0?Math.round(x.cover)+'d':'<span class="dim">—</span>'}</td><td>${x.units>0.5?x.refill.toFixed(1):'<span class="dim">—</span>'}</td><td>${x.soh}</td><td class="${x.gap>=0?'pos':'neg'}">${x.gap>=0?'+':''}${x.gap}</td><td style="font-family:var(--mono);font-size:10.5px" class="${x.gap>0?'pos':(x.gap<0?'neg':'dim')}">${move}</td></tr>`;
      });
    });
    h+='</table>';
    document.getElementById('mchTbl').innerHTML=h;
    document.getElementById('mchNote').innerHTML='† Jeans & Shirts constrained to 3–4 sizes, 1 pc per size (4 pcs/option). Method: store break-even ₹ split by that store\'s category mix (thin stores shrunk toward chain mix), converted to units at category ASP, then shelf capacity allocated proportional to required units. Base stock rounds to whole options. W·F = Winner vs Fresh option split at the chosen winner share — winners are proven repeat sellers (see Winner Bank below), fresh options are new designs/tests. Gap = plan − current SOH (floor + WH); Move converts the gap into options to add or cut.';
    document.getElementById('mchSize').innerHTML='<table><tr><th>Node</th><th>Size set / option</th><th>Depth</th><th>MRP ASP</th><th>Net @ ${disc}%</th><th>Basis (units sold by size)</th></tr>'+
      NODES.map(n=>{
        const ord=Object.entries(nodeAgg[n].sz).filter(([k])=>k!=='nan').sort((a,b)=>b[1]-a[1]);
        return`<tr><td>${n}${TIGHT.has(n)?' †':''}${sizeSet[n].fallback?' <span class="dim" style="font-size:10px">(std curve — thin data)</span>':''}</td><td style="font-family:var(--mono)">${sizeSet[n].set}</td><td><b>${sizeSet[n].depth}</b></td><td>${fmt(nodeMRP[n])}</td><td>${fmt(nodeASP[n])}</td><td style="font-family:var(--mono);font-size:10.5px" class="dim">${ord.slice(0,5).map(([k,v])=>k+':'+v).join('  ')}</td></tr>`;}).join('')+'</table>';
    document.getElementById('mchVel').innerHTML='<table><tr><th>Store</th><th>Req pcs/mo</th><th>Last-30d actual</th><th>Multiple needed</th><th>Verdict</th></tr>'+
      plan.map(p=>{
        const a30=q30S[p.s]||0;
        const mult=a30>0?p.U/a30:null;
        const v=mult==null?'NO RECENT SALES':(mult<=1.3?'ON TRACK':(mult<=2.5?'STRETCH':'DEMAND GAP'));
        const cl=mult==null?'neg':(mult<=1.3?'pos':(mult<=2.5?'':'neg'));
        return`<tr><td>${p.s}</td><td>${Math.round(p.U)}</td><td>${a30}</td><td class="${cl}">${mult==null?'—':mult.toFixed(1)+'×'}</td><td class="${cl}" style="font-family:var(--mono);font-size:10.5px">${v}</td></tr>`;}).join('')+'</table>';
  };
  /* winner bank (static) */
  (()=>{
    const byNS={};
    DATA.forEach(r=>{const k=r.n+'\u0001'+r.st;const a=byNS[k]=byNS[k]||{n:r.n,st:r.st,q:0,net:0,stores:new Set(),first:r.d};a.q+=r.q;a.net+=r.net;a.stores.add(r.s);if(r.d<a.first)a.first=r.d;});
    const sohST={};STOCK.forEach(x=>{const k=x.n+'\u0001'+x.st;sohST[k]=(sohST[k]||0)+x.shop+x.wh;});
    let h='<table><tr><th>Node</th><th>Winner style</th><th>Units</th><th>Net ₹</th><th>ROS/wk</th><th>Selling in</th><th>Chain SOH</th></tr>';
    NODES.forEach(n=>{
      const list=Object.values(byNS).filter(a=>a.n===n&&a.q>0).sort((a,b)=>b.net-a.net).slice(0,TIGHT.has(n)?5:6);
      list.forEach((a,i)=>{
        const days=Math.max(7,Math.round((LASTD-new Date(a.first))/864e5)+1);
        const ros=(a.q/days*7).toFixed(2);
        const dots=STORES.map(s=>`<span title="${s}" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;background:${a.stores.has(s)?SCOLOR[s]:'#DDD2BE'}"></span>`).join('');
        h+=`<tr><td>${i===0?n:''}</td><td>${esc(a.st)}</td><td><b>${a.q}</b></td><td>${fmt(a.net)}</td><td>${ros}</td><td>${dots}<span class="dim" style="font-size:10px"> ${a.stores.size}/4</span></td><td>${sohST[n+'\u0001'+a.st]||0}</td></tr>`;
      });
    });
    h+='</table>';
    document.getElementById('mchWinTbl').innerHTML=h;
  })();
  STORES.forEach(s=>document.getElementById('cap_'+s).oninput=draw);
  document.getElementById('mchDisc').oninput=draw;
  document.getElementById('mchWin').oninput=draw;
  draw();
}



/* ================= 6d. TEE SEND PLAN (warehouse allocation) ================= */
function rTee(){
  const el=document.getElementById('sec-tee');
  /* --- plan context at defaults: tee base per store (same model as Merch Plan) --- */
  const disc=21,ws=55;
  const nodeAggT={};DATA.forEach(r=>{const a=nodeAggT[r.n]=nodeAggT[r.n]||{q:0,net:0};a.q+=r.q;a.net+=r.net;});
  const mrpA={};DATA.forEach(r=>{const a=mrpA[r.n]=mrpA[r.n]||{v:0,q:0};if(r.q>0){a.v+=r.mrp*r.q;a.q+=r.q;}});
  const netASP={};NODES.forEach(n=>netASP[n]=(mrpA[n]&&mrpA[n].q>0?mrpA[n].v/mrpA[n].q:4700)*(1-disc/100));
  const chainNetT=sum(DATA,r=>r.net);
  const teeBase={},teeOpts={};
  STORES.forEach(s=>{
    const rows=DATA.filter(r=>r.s===s);const u=sum(rows,r=>r.q);const w=Math.min(1,u/60);const sNetT=sum(rows,r=>r.net);
    const mix={};let tot=0;
    NODES.forEach(n=>{const sm=sNetT>0?sum(rows.filter(r=>r.n===n),r=>r.net)/sNetT:0;mix[n]=w*sm+(1-w)*(nodeAggT[n].net/chainNetT);tot+=mix[n];});
    NODES.forEach(n=>mix[n]/=tot);
    const units={};let U=0;NODES.forEach(n=>{units[n]=TGT[s]*mix[n]/netASP[n];U+=units[n];});
    teeBase[s]=Math.round(MCAP[s]*units['Tshirts']/U/6)*6;
    teeOpts[s]=teeBase[s]/6;
  });
  /* --- rank tee styles from chain sales (match short names) --- */
  const teeSales={};DATA.filter(r=>r.n==='Tshirts').forEach(r=>{teeSales[r.st.toLowerCase()]=(teeSales[r.st.toLowerCase()]||0)+r.q;});
  const rank=nm=>{const k=nm.toLowerCase();let q=0;Object.entries(teeSales).forEach(([st,v])=>{if(st.includes(k))q+=v;});return q;};
  TEEWH.forEach(x=>{x.sold=rank(x.nm==='Surfer'?'surfer':x.nm);x.left={FS:x.FS,XS:x.XS,S:x.S,M:x.M,L:x.L,XL:x.XL,XXL:x.XXL};});
  const sized=TEEWH.filter(x=>!x.crop&&!x.fsOnly&&x.tot>0).sort((a,b)=>b.sold-a.sold||b.tot-a.tot);
  const fsList=TEEWH.filter(x=>x.fsOnly&&x.tot>0).sort((a,b)=>b.sold-a.sold);
  const crops=TEEWH.filter(x=>x.crop&&x.tot>0);
  /* --- allocation --- */
  const SORDER=['Pune','Hyderabad','Delhi','Mumbai']; /* biggest tee walls first */
  const FSD={Pune:2,Hyderabad:2,Delhi:1,Mumbai:1};   /* FS options per store */
  const CRD={Pune:3,Hyderabad:2,Delhi:1,Mumbai:1};   /* crop test options per store */
  const alloc={};STORES.forEach(s=>alloc[s]={});
  const take=(x,s,want)=>{ /* want = {S:1,M:2,...}; returns taken map+count */
    const got={};let n=0;
    Object.entries(want).forEach(([sz,q])=>{const t=Math.min(q,x.left[sz]||0);if(t>0){got[sz]=t;x.left[sz]-=t;n+=t;}});
    /* backfill shortfall from M/L */
    let short=Object.values(want).reduce((a,b)=>a+b,0)-n;
    ['M','L','XL','S'].forEach(sz=>{while(short>0&&x.left[sz]>0){got[sz]=(got[sz]||0)+1;x.left[sz]--;n++;short--;}});
    if(n>0){const a=alloc[s][x.nm]=alloc[s][x.nm]||{};Object.entries(got).forEach(([sz,q])=>a[sz]=(a[sz]||0)+q);}
    return n;
  };
  const sent={};STORES.forEach(s=>sent[s]=0);
  const setCount={};
  const summary=[];
  SORDER.forEach(s=>{
    const opts=teeOpts[s];
    const fsN=FSD[s],crN=CRD[s];
    const wN=Math.round(opts*ws/100);
    const frN=Math.max(0,opts-wN-fsN-crN);
    let w=0,f=0,fs=0,cr=0;
    /* winners: top-ranked sized styles with stock, 1 set each */
    for(const x of sized){if(w>=wN)break;const n=take(x,s,{S:1,M:2,L:2,XL:1});if(n>=4){w++;setCount[s+'|'+x.nm]=1;}sent[s]+=n;}
    /* FS options */
    for(const x of fsList){if(fs>=fsN)break;const n=take(x,s,{FS:3});if(n>=2){fs++;setCount[s+'|'+x.nm]=1;}sent[s]+=n;}
    /* crop tests */
    for(const x of crops){if(cr>=crN)break;const n=take(x,s,{XS:1,S:2,M:2,L:1});if(n>=4)cr++;sent[s]+=n;}
    /* fresh: lowest-rank sized styles not yet at this store */
    for(const x of [...sized].reverse()){if(f>=frN)break;if(alloc[s][x.nm])continue;const n=take(x,s,{S:1,M:2,L:2,XL:1});if(n>=4){f++;setCount[s+'|'+x.nm]=1;}sent[s]+=n;}
    /* depth fill: repeat winner sets (max 3 sets per style per store) until tee target met */
    let guard=0;
    while(sent[s]<teeBase[s]-3&&guard++<40){
      let added=false;
      for(const x of sized){
        if(sent[s]>=teeBase[s]-3)break;
        const k=s+'|'+x.nm;
        if((setCount[k]||0)>=3||!setCount[k])continue;
        const n=take(x,s,{S:1,M:2,L:2,XL:1});
        if(n>0){setCount[k]++;sent[s]+=n;added=true;}
      }
      /* FS depth top-up too */
      for(const x of fsList){
        if(sent[s]>=teeBase[s]-3)break;
        const k=s+'|'+x.nm;
        if((setCount[k]||0)>=2||!setCount[k])continue;
        const n=take(x,s,{FS:2});
        if(n>0){setCount[k]++;sent[s]+=n;added=true;}
      }
      if(!added)break;
    }
    summary.push({s,opts,wN,fsN,crN,frN,w,fs,cr,f});
  });
  const whLeft=sum(TEEWH,x=>Object.values(x.left).reduce((a,b)=>a+b,0));
  /* --- render --- */
  const SZ=['FS','XS','S','M','L','XL','XXL'];
  const cell=a=>{if(!a)return'<span class="dim">·</span>';const n=Object.values(a).reduce((x,y)=>x+y,0);return `<b>${n}</b> <span class="dim" style="font-size:10px">${SZ.filter(z=>a[z]).map(z=>z+a[z]).join(' ')}</span>`;};
  let mtx='<table><tr><th>Style</th><th>Type</th><th>Chain sold</th>'+STORES.map(s=>'<th>'+s+'</th>').join('')+'<th>Sent</th><th>WH left</th></tr>';
  [...fsList,...sized,...crops].forEach(x=>{
    const type=x.fsOnly?'FS':(x.crop?'CROP':(x.sold>0?'WINNER':'FRESH'));
    const tot=STORES.reduce((a,s)=>a+(alloc[s][x.nm]?Object.values(alloc[s][x.nm]).reduce((p,q)=>p+q,0):0),0);
    const left=Object.values(x.left).reduce((a,b)=>a+b,0);
    mtx+=`<tr><td>${esc(x.nm)}</td><td style="font-family:var(--mono);font-size:10px" class="${type==='WINNER'?'pos':(type==='CROP'?'':'dim')}">${type}</td><td>${x.sold||'<span class="dim">·</span>'}</td>`+
      STORES.map(s=>'<td>'+cell(alloc[s][x.nm])+'</td>').join('')+`<td><b>${tot}</b></td><td class="${left>40?'neg':'dim'}">${left}</td></tr>`;
  });
  mtx+='<tr class="tot"><td>TOTAL</td><td></td><td></td>'+STORES.map(s=>'<td>'+sent[s]+'</td>').join('')+`<td>${sum(Object.values(sent),v=>v)}</td><td>${whLeft}</td></tr></table>`;

  el.innerHTML=`
  <h2>T-Shirt Send Plan — allocating current warehouse stock</h2>
  <div class="sub">Your on-hand tee stock (${fnum(sum(TEEWH,x=>x.tot))} pcs: ${fnum(739)} sized · 89 free-size · 343 crop tops) allocated against the merch plan at defaults (Hyd 250 · 21% discount · 55% winners). Winners get first pick of full size sets; crops go out as tests.</div>
  <div class="grid g4">
    ${summary.sort((a,b)=>STORES.indexOf(a.s)-STORES.indexOf(b.s)).map(x=>`<div class="card kpi"><div class="lbl" style="color:${SCOLOR[x.s]}">${x.s}</div><div class="val">${sent[x.s]} <small>pcs</small></div><div class="cmp">tee plan ${teeBase[x.s]} pcs / ${x.opts} opts · filled ${x.w}W + ${x.f}F + ${x.fs}FS + ${x.cr}Crop</div></div>`).join('')}
  </div>
  <div class="card" style="margin-top:14px"><h2 style="font-size:18px">Style × Store allocation (pcs & size split)</h2><div class="twrap" style="max-height:640px">${mtx}</div>
  <div class="note">Sequence: Pune → Hyd → Delhi → Mumbai (largest tee walls first). Winner set S-1·M-2·L-2·XL-1, repeated up to 3 sets per style in the bigger stores to reach the tee target from a limited style count; where S is finished the set backfills from M/L. FS = free-size graphics at depth 3 (2–3 per store). Crops have no sales history — small test sets XS-1·S-2·M-2·L-1 weighted to Pune & Hyd. WH-left in red = still heavy after allocation → next city drop or online.</div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card icard" style="border-left-color:var(--red)"><h4>Broken S problem</h4><p>Six styles (Psy Bear, Surfer, London, Ballet Queen, Pixel Mos, Extinction) have <b>zero S stock</b> — and S is ~17% of tee demand. Their sets ship M/L-heavy; reorder S in the proven winners with the next production run.</p></div>
    <div class="card icard"><h4>Delusion is out</h4><p>Delusion tee shows <b>0 pcs</b> across all sizes while the Delusion name is a proven seller — straight reorder candidate before it goes cold on the floor.</p></div>
  </div>`;
}


/* ================= 6e. ACTION PLAN (four strategic questions) ================= */
function rAct(){
  const el=document.getElementById('sec-act');
  const sales=DATA.filter(r=>r.q>0);
  const totn=sum(sales,r=>r.net),totq=sum(sales,r=>r.q);
  sales.forEach(r=>r.dp=r.basic>0?(r.basic-r.net)/r.basic*100:0);
  /* Q1 buckets */
  const B=[['Full price',0,.5],['1–20%',.5,20],['20–30%',20,30],['30–40%',30,40],['40%+',40,101]];
  const brows=B.map(([lb,lo,hi])=>{
    const g=sales.filter(r=>r.dp>=lo&&r.dp<hi);
    const q=sum(g,r=>r.q),n=sum(g,r=>r.net);
    return{lb,q,n,asp:q?n/q:0};
  });
  /* paired velocity */
  const bySt={};sales.forEach(r=>{(bySt[r.st]=bySt[r.st]||[]).push(r);});
  let both=0,vf=0,vd=0;
  Object.values(bySt).forEach(rows=>{
    const f=rows.filter(r=>r.dp<.5),dd=rows.filter(r=>r.dp>=20);
    if(f.length&&dd.length){both++;vf+=sum(f,r=>r.q)/new Set(f.map(r=>r.d)).size;vd+=sum(dd,r=>r.q)/new Set(dd.map(r=>r.d)).size;}
  });
  vf/=both;vd/=both;
  /* Q2 */
  const optSN={},stockSt={},sohS={};
  STOCK.forEach(x=>{if(x.shop+x.wh>0){(optSN[x.s+'\u0001'+x.n]=optSN[x.s+'\u0001'+x.n]||new Set()).add(x.st);(stockSt[x.s]=stockSt[x.s]||new Set()).add(x.st);}sohS[x.s]=(sohS[x.s]||0)+x.shop+x.wh;});
  const netSt={};sales.forEach(r=>netSt[r.st]=(netSt[r.st]||0)+r.net);
  const top15=Object.entries(netSt).sort((a,b)=>b[1]-a[1]).slice(0,15).map(x=>x[0]);
  const cut=new Date(new Date(INVDATE)-30*864e5).toISOString().slice(0,10);
  const q30={};sales.forEach(r=>{if(r.d>=cut)q30[r.s]=(q30[r.s]||0)+r.q;});
  /* Q3 bills */
  const bills={};
  sales.forEach(r=>{if(r.cust&&r.cust!=='nan'){const k=r.cust+'\u0001'+r.d+'\u0001'+r.s;const b=bills[k]=bills[k]||{q:0,net:0,basic:0,s:r.s};b.q+=r.q;b.net+=r.net;b.basic+=r.basic;}});
  const BL=Object.values(bills);
  const upt=sum(BL,b=>b.q)/BL.length, abv=sum(BL,b=>b.net)/BL.length;
  const one=BL.filter(b=>b.q===1),multi=BL.filter(b=>b.q>=2);
  const custN={};sales.forEach(r=>{if(r.cust&&r.cust!=='nan')custN[r.cust]=(custN[r.cust]||0)+r.net;});
  const t10=Object.values(custN).sort((a,b)=>b-a).slice(0,10).reduce((a,b)=>a+b,0);
  const custD={};sales.forEach(r=>{if(r.cust&&r.cust!=='nan')(custD[r.cust]=custD[r.cust]||new Set()).add(r.d);});
  const rep=Object.values(custD).filter(s=>s.size>1).length,nc=Object.keys(custD).length;
  const d1=sum(one,b=>b.basic)>0?(1-sum(one,b=>b.net)/sum(one,b=>b.basic))*100:0;
  const d2=sum(multi,b=>b.basic)>0?(1-sum(multi,b=>b.net)/sum(multi,b=>b.basic))*100:0;
  /* dead 30d */
  const q30ss={};sales.forEach(r=>{if(r.d>=cut)q30ss[r.s+'\u0001'+r.st]=(q30ss[r.s+'\u0001'+r.st]||0)+r.q;});
  const ssAgg={};STOCK.forEach(x=>{const k=x.s+'\u0001'+x.st;const a=ssAgg[k]=ssAgg[k]||{q:0,v:0};a.q+=x.shop+x.wh;a.v+=(x.shop+x.wh)*x.mrp;});
  let deadQ=0,deadV=0;Object.entries(ssAgg).forEach(([k,a])=>{if(a.q>0&&!q30ss[k]){deadQ+=a.q;deadV+=a.v;}});
  const soh=sum(STOCK,x=>x.shop+x.wh);

  const uptRow=s=>{const g=BL.filter(b=>b.s===s);return g.length?(sum(g,b=>b.q)/g.length).toFixed(2):'—';};
  el.innerHTML=`
  <h2>Action Plan — the four strategic questions, answered by the data</h2>
  <div class="sub">Discount behaviour · merchandise-mix gap · bill size & customers · optimal discount architecture</div>

  <div class="card" style="margin-top:4px"><h2 style="font-size:19px">Q1 · Is discounting affecting buying behaviour?</h2>
  <p style="font-size:13px;color:var(--mut2);margin:6px 0 10px"><b style="color:var(--ink)">Verdict: it changes what customers pay, not whether they buy.</b> Across ${both} styles sold both at full price and at 20%+ off, velocity is statistically identical — <b>${vf.toFixed(2)} vs ${vd.toFixed(2)} units per selling day</b>. Meanwhile full-price sales still deliver <b>${(brows[0].n/totn*100).toFixed(0)}% of value</b> at ₹${Math.round(brows[0].asp).toLocaleString('en-IN')} ASP, and the 40%+ bucket takes ${(brows[4].q/totq*100).toFixed(0)}% of units for only ${(brows[4].n/totn*100).toFixed(0)}% of value. Current discounting is margin transfer, not demand creation.</p>
  <div class="twrap"><table><tr><th>Discount band</th><th>Units</th><th>Unit share</th><th>Net ₹</th><th>Value share</th><th>ASP</th></tr>
  ${brows.map(b=>`<tr><td>${b.lb}</td><td>${b.q}</td><td>${(b.q/totq*100).toFixed(1)}%</td><td>${fmt(b.n)}</td><td>${(b.n/totn*100).toFixed(1)}%</td><td>${fmt(b.asp)}</td></tr>`).join('')}</table></div></div>

  <div class="card" style="margin-top:14px"><h2 style="font-size:19px">Q2 · Is the mix gap hurting other stores vs Hyderabad?</h2>
  <p style="font-size:13px;color:var(--mut2);margin:6px 0 10px"><b style="color:var(--ink)">Verdict: yes — but differently per store.</b> <b>Mumbai</b> is a breadth problem: only ${stockSt['Mumbai'].size} options in stock (vs Hyd's ${stockSt['Hyderabad'].size}) yet its productivity per option (${(q30['Mumbai']/stockSt['Mumbai'].size).toFixed(2)}/mo) is second only to Hyd (${(q30['Hyderabad']/stockSt['Hyderabad'].size).toFixed(2)}) — give it Hyd's assortment and sales should scale. <b>Delhi</b> has both thin breadth (${stockSt['Delhi'].size} options) and weak productivity (${(q30['Delhi']/stockSt['Delhi'].size).toFixed(2)}) — assortment plus demand-side work. <b>Pune</b> carries the most options (${stockSt['Pune'].size}) but converts worst (${(q30['Pune']/stockSt['Pune'].size).toFixed(2)}/option) — a depth-and-relevance problem, not a gap.</p>
  <div class="twrap"><table><tr><th>Store</th><th>Options in stock</th><th>Top-15 winners present</th><th>30d units</th><th>Units / option / mo</th><th>SOH</th><th>UPT</th><th>Diagnosis</th></tr>
  ${STORES.map(s=>{const have=top15.filter(t=>stockSt[s].has(t)).length;const prod=q30[s]/stockSt[s].size;
    const diag=s==='Hyderabad'?'BENCHMARK':(s==='Mumbai'?'ADD BREADTH':(s==='Delhi'?'BREADTH + DEMAND':'FIX MIX & DEPTH'));
    return`<tr><td>${s}</td><td>${stockSt[s].size}</td><td>${have}/15</td><td>${q30[s]||0}</td><td class="${prod>=1?'pos':'neg'}">${prod.toFixed(2)}</td><td>${sohS[s]}</td><td>${uptRow(s)}</td><td style="font-family:var(--mono);font-size:10.5px">${diag}</td></tr>`;}).join('')}</table></div></div>

  <div class="card" style="margin-top:14px"><h2 style="font-size:19px">Q3 · Bill size, UPT & single-customer impact</h2>
  <p style="font-size:13px;color:var(--mut2);margin:6px 0 10px"><b style="color:var(--ink)">Verdict: the bill is the bottleneck.</b> Chain UPT is <b>${upt.toFixed(2)}</b> (ABV ${fmt(abv)}), with <b>${(one.length/BL.length*100).toFixed(0)}% single-unit bills</b>. Yet the ${multi.length} multi-unit bills (${(multi.length/BL.length*100).toFixed(0)}% of bills) carry <b>${(sum(multi,b=>b.q)/sum(BL,b=>b.q)*100).toFixed(0)}% of units</b>. Top-10 customers = <b>${(t10/totn*100).toFixed(1)}%</b> of net sales, and only <b>${rep} of ${nc}</b> customers ever returned on a second day — acquisition is working, attachment and retention are not. Moving UPT from ${upt.toFixed(2)} to 1.40 at the same bill count is worth roughly <b>${fmtL((1.40-upt)*BL.length/ (new Set(sales.map(r=>r.mk)).size) * (totn/totq))}</b>/month.</p>
  <div class="grid g3">
    <div class="card icard"><h4>UPT ladder</h4><p>1-unit ${one.length} bills · 2-unit ${BL.filter(b=>b.q===2).length} · 3+ ${BL.filter(b=>b.q>=3).length}. Mumbai lowest UPT (${uptRow('Mumbai')}) — needs the 2nd-unit hook most.</p></div>
    <div class="card icard"><h4>Discount vs UPT today</h4><p>1-unit bills already average <b>${d1.toFixed(1)}%</b> off; 2+ unit bills <b>${d2.toFixed(1)}%</b>. Discounts are being given without buying the second unit — the ladder exists by accident, not design.</p></div>
    <div class="card icard"><h4>Retention hole</h4><p>${rep}/${nc} repeat buyers. A WhatsApp nudge to the ${nc}-strong ID'd base (new-drop previews, size-restock alerts) is the cheapest revenue in this plan.</p></div>
  </div></div>

  <div class="card" style="margin-top:14px"><h2 style="font-size:19px">Q4 · Flat tiered discounting vs quantity-break — the recommended architecture</h2>

const DIMS={Store:r=>r.s,Month:r=>mLabel(r.mk),Date:r=>r.d,Weekday:r=>WD[r.wd],Node:r=>r.n,Department:r=>r.dept,Style:r=>r.st,Size:r=>r.sz,Colour:r=>r.c};
const DIMORD={Month:v=>MONTHS.map(mLabel).indexOf(v),Weekday:v=>WD.indexOf(v),Size:v=>['XS','S','M','L','XL','XXL','Onesize','nan'].indexOf(v)};
const VALS={Qty:{f:r=>r.q,agg:'sum'},['Net ₹']:{f:r=>r.net,agg:'sum'},['Basic ₹']:{f:r=>r.basic,agg:'sum'},['Discount ₹']:{f:r=>r.disc,agg:'sum'},['MRP Value']:{f:r=>r.mrp*r.q,agg:'sum'},Lines:{f:()=>1,agg:'sum'},['ASP (net/qty)']:{special:'asp'},['Disc % (of basic)']:{special:'discpct'}};
const AGGS=['sum','avg','min','max','count'];
const pv={rows:['Month'],cols:['Store'],vals:[{k:'Net ₹',agg:'sum'}],filters:{}};
function rPvt(){
  const el=document.getElementById('sec-pvt');
  el.innerHTML=`
  <h2>Pivot Builder — drag & drop analysis</h2>
  <div class="sub">Your Power-BI-style workbench: drag fields into Rows / Columns / Values / Filters, choose aggregation, and slice the raw 433-line YTD data any way you want</div>
  <div class="card">
    <h4 class="hint" style="margin-bottom:6px">FIELD LIST — drag into a zone below (dark = dimension, gold = measure)</h4>
    <div class="pv-fields" id="pvFields"></div>
    <div class="pv-zones">

      <div class="pv-zone" data-z="rows"><h4>≡ Rows</h4><div class="zbox"></div></div>
      <div class="pv-zone" data-z="cols"><h4>∥ Columns</h4><div class="zbox"></div></div>

    <div class="twrap" id="pvOut" style="max-height:620px"></div>
    <div class="note">Tip: Rows = Style, Columns = Month, Values = Qty rebuilds the Product Tracker · Rows = Store + Node, Values = Net ₹ + ASP gives store-category productivity.</div>

  const fl=document.getElementById('pvFields');

  Object.keys(VALS).forEach(k=>{const d=document.createElement('div');d.className='pv-field val-f';d.textContent=k;d.draggable=true;d.ondragstart=e=>e.dataTransfer.setData('text/plain','V|'+k);fl.appendChild(d);});
  document.querySelectorAll('.pv-zone').forEach(z=>{

    z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=e=>{e.preventDefault();z.classList.remove('over');
      const[typ,k]=e.dataTransfer.getData('text/plain').split('|');const zone=z.dataset.z;
      if(zone==='vals'){if(typ!=='V')return;if(!pv.vals.find(v=>v.k===k))pv.vals.push({k,agg:VALS[k].agg||'sum'});}
      else{if(typ!=='D')return;
        if(zone==='filters'){if(!(k in pv.filters))pv.filters[k]=new Set();}
        else{['rows','cols'].forEach(zz=>pv[zz]=pv[zz].filter(x=>x!==k));if(!pv[zone].includes(k))pv[zone].push(k);}}

function drawPv(){
  ['filters','rows','cols','vals'].forEach(zone=>{
    const box=document.querySelector(`.pv-zone[data-z="${zone}"] .zbox`);box.innerHTML='';
    const items=zone==='vals'?pv.vals:(zone==='filters'?Object.keys(pv.filters):pv[zone]);
    items.forEach((it,i)=>{
      const k=zone==='vals'?it.k:it;
      const d=document.createElement('div');d.className='pv-field '+(zone==='vals'?'val-f':'dim-f');
      d.innerHTML=esc(k);
      if(zone==='vals'&&!VALS[k].special){const s=document.createElement('select');AGGS.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a.toUpperCase();if(a===it.agg)o.selected=true;s.appendChild(o);});s.onchange=()=>{it.agg=s.value;drawPv();};d.appendChild(s);}
      const x=document.createElement('span');x.className='x';x.textContent='×';
      x.onclick=()=>{if(zone==='vals')pv.vals.splice(i,1);else if(zone==='filters')delete pv.filters[k];else pv[zone]=pv[zone].filter(z=>z!==k);drawPv();};
      d.appendChild(x);box.appendChild(d);
    });
    if(!items.length)box.innerHTML='<span class="hint">drop here</span>';
  });
  const fui=document.getElementById('pvFilterUI');fui.innerHTML='';
  Object.keys(pv.filters).forEach(k=>{
    const vals=[...new Set(DATA.map(DIMS[k]))].sort((a,b)=>DIMORD[k]?DIMORD[k](a)-DIMORD[k](b):String(a).localeCompare(b));
    const wrap=document.createElement('div');wrap.className='fstrip';wrap.style.marginBottom='8px';
    wrap.innerHTML=`<label>${k}</label>`;const ch=document.createElement('div');ch.className='chips';
    if(!pv.filters[k].size)vals.forEach(v=>pv.filters[k].add(v));
    vals.forEach(v=>{const c=document.createElement('span');c.className='chip'+(pv.filters[k].has(v)?' on':'');c.textContent=v;
      c.onclick=()=>{pv.filters[k].has(v)?pv.filters[k].delete(v):pv.filters[k].add(v);if(!pv.filters[k].size)vals.forEach(x=>pv.filters[k].add(x));drawPv();};ch.appendChild(c);});
    wrap.appendChild(ch);fui.appendChild(wrap);
  });
  // aggregate
  let rows=DATA.filter(r=>Object.entries(pv.filters).every(([k,set])=>set.has(DIMS[k](r))));
  const rk=r=>pv.rows.map(k=>DIMS[k](r)).join(' › ')||'Total';
  const ck=r=>pv.cols.map(k=>DIMS[k](r)).join(' › ')||'Value';
  const cells={},rset=new Set(),cset=new Set();
  rows.forEach(r=>{const a=rk(r),b=ck(r);rset.add(a);cset.add(b);(cells[a+'\u0001'+b]=cells[a+'\u0001'+b]||[]).push(r);});
  const sorter=(keys,dims)=>[...keys].sort((a,b)=>{const A=a.split(' › '),B=b.split(' › ');for(let i=0;i<dims.length;i++){const f=DIMORD[dims[i]];const c=f?f(A[i])-f(B[i]):String(A[i]).localeCompare(B[i]);if(c)return c;}return 0;});
  const R=sorter(rset,pv.rows),C=sorter(cset,pv.cols);
  const calc=(recs,v)=>{
    if(!recs||!recs.length)return null;
    const def=VALS[v.k];
    if(def.special==='asp'){const q=sum(recs,r=>r.q);return q?sum(recs,r=>r.net)/q:null;}
    if(def.special==='discpct'){const b=sum(recs,r=>r.basic);return b?(1-sum(recs,r=>r.net)/b)*100:null;}
    const arr=recs.map(def.f);
    switch(v.agg){case'sum':return arr.reduce((a,x)=>a+x,0);case'avg':return arr.reduce((a,x)=>a+x,0)/arr.length;case'min':return Math.min(...arr);case'max':return Math.max(...arr);case'count':return arr.length;}
  };
  const fmtV=(v,k)=>v==null?'<span class="dim">·</span>':(k.includes('₹')||k.includes('ASP')||k==='MRP Value'?fmt(v):(k.includes('%')?v.toFixed(1)+'%':(Number.isInteger(v)?fnum(v):v.toFixed(2))));
  const nv=pv.vals.length||1;
  let h='<table><tr><th rowspan="'+(pv.vals.length>1?2:1)+'">'+(pv.rows.join(' › ')||'')+'</th>';
  C.forEach(c=>h+='<th colspan="'+nv+'">'+esc(c)+'</th>');
  h+='<th colspan="'+nv+'" style="background:#432020">TOTAL</th></tr>';
  if(pv.vals.length>1){h+='<tr>';[...C,'T'].forEach(()=>pv.vals.forEach(v=>h+='<th style="background:#5C2B2B">'+esc(v.k)+'</th>'));h+='</tr>';}
  if(!pv.vals.length){document.getElementById('pvOut').innerHTML='<div class="hint" style="padding:20px">Drop at least one measure into Values.</div>';return;}
  R.forEach(a=>{
    h+='<tr><td>'+esc(a)+'</td>';
    C.forEach(b=>pv.vals.forEach(v=>h+='<td>'+fmtV(calc(cells[a+'\u0001'+b],v),v.k)+'</td>'));
    const rowRecs=rows.filter(r=>rk(r)===a);
    pv.vals.forEach(v=>h+='<td style="background:#F3EAD8"><b>'+fmtV(calc(rowRecs,v),v.k)+'</b></td>');
    h+='</tr>';
  });
  h+='<tr class="tot"><td>TOTAL</td>';
  C.forEach(b=>{const colRecs=rows.filter(r=>ck(r)===b);pv.vals.forEach(v=>h+='<td>'+fmtV(calc(colRecs,v),v.k)+'</td>');});
  pv.vals.forEach(v=>h+='<td>'+fmtV(calc(rows,v),v.k)+'</td>');
  h+='</tr></table>';
  document.getElementById('pvOut').innerHTML=h;
}

  const T=sum(DATA,r=>r.net), TB=sum(DATA,r=>r.basic), TQ=sum(DATA,r=>r.q);
  const discPct=(1-T/TB)*100;
  const fullPrice=DATA.filter(r=>r.q>0&&r.disc===0);
  const fpShare=sum(fullPrice,r=>r.net)/T*100;
  const returns=DATA.filter(r=>r.q<0);
  const byDay={};DATA.forEach(r=>byDay[r.d]=(byDay[r.d]||0)+r.net);
  const best=Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  const wkend=sum(DATA.filter(r=>r.wd===0||r.wd===6),r=>r.net)/T*100;
  const custDates={};DATA.forEach(r=>{if(r.cust&&r.cust!=='nan')(custDates[r.cust]=custDates[r.cust]||new Set()).add(r.d);});
  const nCust=Object.keys(custDates).length;
  const repeat=Object.values(custDates).filter(s=>s.size>1).length;
  const byStyle={};DATA.forEach(r=>byStyle[r.st]=(byStyle[r.st]||0)+r.net);
  const top10=Object.values(byStyle).sort((a,b)=>b-a).slice(0,10).reduce((a,b)=>a+b,0)/T*100;
  const mtd=DATA.filter(r=>r.mk===CURMK);
  const jun5=DATA.filter(r=>r.mk===PREVMK&&r.day<=CURDAY);
  const paceP=pct(sum(mtd,r=>r.net),sum(jun5,r=>r.net));
  // store momentum: last full month vs prior
  const lastFull=PREVMK, prior=MONTHS[MONTHS.indexOf(PREVMK)-1];
  const sm=STORES.map(s=>({s,g:pct(sum(DATA.filter(r=>r.s===s&&r.mk===lastFull),r=>r.net),sum(DATA.filter(r=>r.s===s&&r.mk===prior),r=>r.net))}));
  const smUp=sm.filter(x=>x.g!=null).sort((a,b)=>b.g-a.g);
  // single-store styles
  const stStores={};DATA.forEach(r=>{(stStores[r.st]=stStores[r.st]||new Set()).add(r.s);});
  const singleStore=Object.values(stStores).filter(s=>s.size===1).length;

  el.innerHTML=`
  <h2>Analyst Insights & What To Add Next</h2><div class="sub">Auto-computed reads on the YTD data, plus the metrics this MIS should grow into</div>
  <div class="grid g3">
    <div class="card icard"><h4>${mLabel(CURMK)} pace vs ${mLabel(PREVMK)}</h4><p>First ${CURDAY} days are <b class="${cls(paceP)}">${pctTxt(paceP)}</b> vs the same days of ${mLabel(PREVMK)} (<b>${fmt(sum(mtd,r=>r.net))}</b> vs <b>${fmt(sum(jun5,r=>r.net))}</b>). Watch weekend of 11–12 Jul to confirm the trajectory.</p></div>
    <div class="card icard"><h4>Discount depth</h4><p>Effective YTD discount is <b>${discPct.toFixed(1)}%</b> of basic value. Only <b>${fpShare.toFixed(0)}%</b> of net sales came at full price — promo-led selling is the norm; track margin per style before deepening offers.</p></div>
    <div class="card icard"><h4>Concentration risk</h4><p>Top 10 styles = <b>${top10.toFixed(0)}%</b> of net sales across ${STYLES.length} styles. Refill depth on these 10 matters more than breadth of new options.</p></div>
    <div class="card icard"><h4>Weekend engine</h4><p>Sat + Sun deliver <b>${wkend.toFixed(0)}%</b> of YTD value. Staffing, VM changes and stock landings should be locked by Friday close.</p></div>
    <div class="card icard"><h4>Returns</h4><p><b>${returns.length}</b> return lines worth <b>${fmt(-sum(returns,r=>r.net))}</b> netted off. Log return reasons (fit / quality / exchange) at POS to make this actionable.</p></div>
    <div class="card icard"><h4>Repeat customers</h4><p><b>${repeat}</b> of <b>${nCust}</b> tracked customers bought on more than one day (${(repeat/nCust*100).toFixed(1)}%). A simple WhatsApp nudge program on the ${repeat}-strong base is low-hanging fruit.</p></div>
    <div class="card icard"><h4>Store momentum (${mLabel(lastFull)} vs ${mLabel(prior)})</h4><p>${smUp.map(x=>`${x.s} <b class="${cls(x.g)}">${pctTxt(x.g)}</b>`).join(' · ')}</p></div>
    <div class="card icard"><h4>Best day on record</h4><p><b>${new Date(best[0]).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</b> at <b>${fmt(best[1])}</b>. Replicate the trigger — check what promo / event / stock drop ran that day.</p></div>
    <div class="card icard"><h4>Distribution gaps</h4><p><b>${singleStore}</b> of ${STYLES.length} styles have sold in only one store. Cross-seed proven single-store winners before reordering fresh styles.</p></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2 style="font-size:18px">Weekday pattern — net ₹</h2><div class="chartbox short"><canvas id="cWd"></canvas></div></div>
    <div class="card"><h2 style="font-size:18px">Size curve — units YTD</h2><div class="chartbox short"><canvas id="cSz"></canvas></div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2 style="font-size:18px">ASP by month</h2><div class="chartbox short"><canvas id="cAsp"></canvas></div></div>
    <div class="card"><h2 style="font-size:18px">Discount % by month</h2><div class="chartbox short"><canvas id="cDisc"></canvas></div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2 style="font-size:18px">Recommended additions to this MIS</h2>
    <p style="font-size:13px;color:var(--mut2);line-height:1.7">To take this from a sales tracker to a full retail cockpit, feed in four more data streams. <b>1) SOH by store</b> unlocks sell-through %, stock cover in weeks and a live refill engine (the Master sheet's SOH column is currently mostly blank). <b>2) Footfall counts</b> from Broadway unlock conversion % and bill-cut analysis per store. <b>3) Cost / margin per style</b> converts every leaderboard here from revenue-ranked to contribution-ranked — a 40%-off hero may earn less than a full-price mid-seller. <b>4) Monthly store targets</b> enable target-vs-achievement gauges and flag shortfalls by day 10, not day 30. Also worth capturing at POS: payment mode on all months (only Jul has it today), and return reason codes.</p>
  </div>`;

  const wd=Array(7).fill(0);DATA.forEach(r=>wd[r.wd]+=r.net);
  const ord=[1,2,3,4,5,6,0];
  mkChart('cWd',{type:'bar',data:{labels:ord.map(i=>WD[i]),datasets:[{data:ord.map(i=>wd[i]),backgroundColor:ord.map(i=>(i===0||i===6)?'#D9A441':'#5C2B2B'),borderRadius:4}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw)}}},scales:{y:{ticks:{callback:v=>fmtL(v)}}},maintainAspectRatio:false}});
  const szOrd=['S','M','L','XL','XXL','Onesize'];const sz={};DATA.forEach(r=>sz[r.sz]=(sz[r.sz]||0)+r.q);
  const szK=szOrd.filter(k=>sz[k]).concat(Object.keys(sz).filter(k=>!szOrd.includes(k)));
  mkChart('cSz',{type:'bar',data:{labels:szK,datasets:[{data:szK.map(k=>sz[k]),backgroundColor:'#B03A2E',borderRadius:4}]},options:{plugins:{legend:{display:false}},maintainAspectRatio:false}});
  const mAsp=MONTHS.map(mk=>{const rs=DATA.filter(r=>r.mk===mk);const q=sum(rs,r=>r.q);return q?sum(rs,r=>r.net)/q:0;});
  mkChart('cAsp',{type:'line',data:{labels:MONTHS.map(mLabel),datasets:[{data:mAsp,borderColor:'#2D1515',backgroundColor:'#2D1515',tension:.3}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw)}}},scales:{y:{ticks:{callback:v=>fmt(v)}}},maintainAspectRatio:false}});
  const mDisc=MONTHS.map(mk=>{const rs=DATA.filter(r=>r.mk===mk);const b=sum(rs,r=>r.basic);return b?(1-sum(rs,r=>r.net)/b)*100:0;});
  mkChart('cDisc',{type:'line',data:{labels:MONTHS.map(mLabel),datasets:[{data:mDisc,borderColor:'#C9722E',backgroundColor:'#C9722E',tension:.3,fill:false}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw.toFixed(1)+'%'}}},scales:{y:{ticks:{callback:v=>v+'%'}}},maintainAspectRatio:false}});
}

renderTab('ov');
</script></body></html>
